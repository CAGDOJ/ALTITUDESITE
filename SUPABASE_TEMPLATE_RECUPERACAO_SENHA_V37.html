<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#f3f7fa;font-family:Arial,sans-serif;color:#17324a">
    <div style="max-width:600px;margin:0 auto;padding:32px 16px">
      <div style="background:#07314f;color:#fff;padding:22px 26px;border-radius:16px 16px 0 0">
        <strong style="font-size:25px;letter-spacing:.04em">ALTITUDE</strong>
        <div style="font-size:13px;margin-top:5px">Portal do Aluno</div>
      </div>
      <div style="background:#fff;border:1px solid #d7e4ec;border-top:0;padding:28px 26px;border-radius:0 0 16px 16px">
        <h1 style="font-size:23px;color:#07314f;margin-top:0">Redefinir sua senha</h1>
        <p>Recebemos uma solicitação para criar uma nova senha de acesso ao Portal Altitude.</p>
        <p style="margin:26px 0">

        </p>
        <p style="font-size:13px;color:#62788a">Se você não solicitou a redefinição, ignore esta mensagem. Não compartilhe este link.</p>
      </div>
    </div>
